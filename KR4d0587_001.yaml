body:
  text: 復古詩集卷一元楊維楨撰琴操并引琴操為退之獨步子厚不敢作遂作鐃歌古之文人相服而不相忌者如此後之詩人動以琴操自髙如蠻郎罷學華語華不華蠻不蠻令人有可鄙者余與永嘉李季和在吳下論古今人詩季和酒酣歌退之羑里操舉酒屬豫曰楊亷夫崛強作漢魏人古樂府亦能作昌黎伯琴操乎余激其挑亟領曰請題季和遂命精衛而下凡九題余明日賦畢又明日復補退之履霜殘形二操季和讀之拍几三呌曰楊亷夫鐵龍精也人欲和之誰敢誰敢至正辛巳秋九月會稽楊維楨録以為序精衛操見古樂府一卷琬曰按述異記炎帝女溺死東海化為精衛日銜西山木石以填東海怨溺死也水在海石在山海水不縮石不刋銜石向海安口血離離海同乾附郭翼和辭東海水雖大精衛心不移銜石填海有滿時有滿時海有底吁嗟人心不如海叶喜附陸仁和辭精衛兩翼大飛向海波去口銜石子不知數山髙髙海深深山髙海深石自沈石婦操并引卷見古樂府一稍異琬曰石婦即望夫石也在處有之補入琴操悲其志與精衛同不必問其主名也山夫折山花山頭朝石婦行人幾時歸東海山頭有時聚行人歸啼石柱石婦岑岑化黃土箕山操見古樂府一卷琬曰堯讓天下於巢父巢父曰君之牧天下猶豫之牧犢吾無用天下為莊子有樊仲父牽牛飲水見巢父洗耳驅牛而還恥令牛飲其下流也箕之山可耕而樵叶囚箕之水兮可飲而遊牽牛何來兮飲吾上流彼以天下讓兮我以之逃叶投世豈無堯兮應堯之求吾與堯友兮不與堯憂附季和和辭箕山之陽兮其木翏翏箕山之冡兮白雲幽幽彼世之人兮孰能遺我以憂雖欲從我兮其路無由朝有人兮來飲其牛漢水操琬曰即祓禊曲也王子年拾遺記曰周昭王溺於漢水二女延娟延娛從王夾擁王身同沒焉故江漢人至上巳日禊集祠間以為風俗湘水離離徒以斑我衣漢水漪漪可以禊我衣翩然凌波夾龍飛隨龍雲雨隨龍歸彼望疑兮疑是非介山操琬曰琴操有龍蛇歌以為介子辭先生嫌其辭有憾為演厥辭庶介山君子之旨也一龍失所五蛇從之周天下叶户四蛇完身一蛇獨虧股虧作刲非龍上天兮蛇各有户一蛇無户薄以焦火叶吁嗟乎四蛇從龍作甘雨一地焦枯無恨在下土崩城操琬曰按崔豹云杞梁妻乃杞殖妻妹朝日之所作也殖戰死妻哭而城頺遂投淄水死其妹悲之作歌名杞梁妻僧貫休始以築長城義作辭其辭亦精悍宋吳邁逺輩不能及也先生用是義補崩城操白骨築長城長城不可穴十日哭長城長城為我裂白骨斑斑食紅血抱骨著心肚白骨作人語君不見淄之水喁喁至今下有比骨魚前旌操琬曰衛後母子壽毌欲殺前母子伋而立壽使伋乘舟於河將沉而殺之壽知之與伋同舟不得沉又使伋之齊令盜見載旌者殺之壽又竊旌前行盜見殺之伋載壽尸還亦死爾乘舟兮河水濁且深我同舟兮誓與爾同沈毌有命兮諌不我聽示旌以盜兮我先有旌衛有國兮國在兄殺兄及我兮我不如無生桑中婦操琬曰此秋胡題也曹魏諸作不關本題晉傅玄始詠秋婦過剛先生此辭特解玄議秋夫君娶妻五日即仕陳五年歸來未拜親桑中見美人我出堂前認夫君走赴沂水沉我身秋夫君令我嗔婦可不義親何可不仁扊扅操琬曰按風俗通百里奚為秦相堂上樂作所賃浣婦自言知音因援琴而歌問之乃其故妻遂還為夫婦百里奚作秦相不再妻堂下浣婦歌扊扅舂黃黎扼伏雞堂下鼓絃堂上覆樽百年夫婦失復親秦穆君賀相臣夫旌義婦旌仁履霜操見古樂府一卷本詞曰朝履霜兮採晨寒考不明其心兮信讒言何辜皇天兮邅斯愆痛沒不同兮恩有偏誰説碩兮知此寃使是辭果出伯竒則伯竒不得希於舜矣退之辭亦未至今為之補曰霜鮮鮮兮草戔戔兒有罪兮兒宿野田衣荷之葉兮葉易穿採楟花以食兮食不下咽天吾父兮天胡有偏我不父順兮父寧不兒憐履晨霜兮泣吾天兒有罪一作兒獨履天吾父兮作嗟兒天父兮殘形操退之作殘形操末語曰臣咸上天識者其誰余以其詞尚欠歸宿不如拘幽將歸二操語可詠也遂為之補曰我夢有獸兮其獸曰貍貍有怪兮身首異而告我以凶兮戒而戒而我丘有首兮誓死完以歸李季和書復先生云夜讀九操辭及補退之辭皆精悍古雅使退之土下有聞亦韙之鐵崖辭行退之不得稱千古獨步非佞非佞復古詩集卷一
