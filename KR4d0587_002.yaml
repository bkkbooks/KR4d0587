body:
  text: 復古詩集卷二元楊維楨撰炮烙辭炮烙復炮烙是不還是不終殺讒人虎不殺羑中囚烽燧曲見古樂府九巻上二句作下二句美人方一笑烽火不須驚昨夜驪山下西戎已結兵放麑辭見古樂府九巻毌麑急麑子獵父眎如傷太子奔城父君王赦奮揚牧羝曲見古樂府九巻老羝何日乳歸鴈忽能言不逐虞常死丁零尚有恩漸臺曲一名貞婦詞見古樂府皎日常持信倉皇不改貞君王符不到水長漸臺傾北郭辭見古樂府九巻作屈婦詞瓜田不納履北郭招讒汙覆鼎重開日宫中殺破胡城門曲見古樂府九巻諜報越王兵城門夜不扃孤臣睛不死門月照人青蘇臺曲見古樂府九巻呉王張髙宴臺下閲犀兵髙臺三百里不見越王城望鄉臺見古樂府九巻望鄉臺上客秋至望鄉關中原遮望眼可奈燕支山飲馬窟見古樂府九巻長城飲馬窟飲馬馬還驚寧知嗚咽水猶作寳刀鳴俠客辭見古樂府九巻未許仝交死全身報國仇太阿飛出匣欲取賈充頭劍客辭丈夫萬人敵拙計哂荆軻昨夜西征去生擒李左車昭陽曲見古樂府九巻美人新睡起内史報蘭湯散盡黄金餅無尋赤鳯凰銅雀曲見古樂府九巻帳中歌吹作玉座奉晨曛西陵迷望眼日莫起浮雲奉晨一作翠簾妲己圖見古樂府九巻小白竿頭血新圖入漢廷宫中雙燕子齊作牝雞鳴秦宫曲見古樂府九巻作桑隂曲妾自夫君戍桑隂路不通將軍哮似虎少婦竊秦宫三閣辭見古樂府九巻江南龍虎氣樓閣照金銀望見長安道不知塵汙人胭脂井昨夜韓擒虎金陵奏凱迴井中人不死重帶美人來焦仲卿妻見古樂府九巻生為仲卿婦死與仲卿齊廬江同樹鳥不過别枝啼朱厓令女見古樂府九巻珠作朱關珠争兩死兩死獨誰當關吏不埀泣青天應雨霜摘瓜辭見古樂府九巻黄臺八瓜熟瓜熟瓞綿綿惟有大瓜好狐來瓜已穿食桃辭二桃陷忠勇晏子設危謀半桃陷姑息彌子復誰尤復古詩集巻二
  hash: sha256:13c5ee29267f3f96ce945a6cfe0bf84a64097577bf9d7f390a7944ac7fbbe82c
