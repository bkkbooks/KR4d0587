body:
  text: 復古詩集别集類四元提要臣等謹案復古詩集六巻元楊維楨撰所載皆琴操宫詞冶春遊仙香奩等作而古樂府亦雜厠其問乃其門人章琬所編以其體皆時俗所置而不為故以復古為名琬序稱輯前後所製者二百首連呉復所編又三百首而今止一百五十二首數不相符或後人已有所刪削非完本歟其中香奩諸詩為他本所不載古樂府諸篇則與鐵崖樂府相複者數十首而稍有異同如石歸操山夫折山花句上樂府本尚有峩峩孤竹岡上有石新婦二句山頭朝石婦句樂府本作嵗嵗山頭歌石婦又烽燧曲一首樂府本以上二句作下二句其文互有顛倒又樂府本所載詩題與此本異者如北郭詞之作屈歸詞秦宫曲之作桑隂曲合歡詞之作生合歡空桑曲之作髙樓曲此類不一而足盖呉復編鐵崖樂府在至正六年琬編此集在至正二十四年相距幾二十載殆維楨於舊稿又有所改定故琬據而録之此當從其定本不當泥其初稿矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀復古詩集序我朝詩體備矣惟古樂府則置而不為天厯以來㑹稽楊先生與五峰李先生始相倡和為古樂府辭先生嘗曰詩難樂府為尤難吾為古樂府非特聲諧金石可勸可戒使人懲創感發者有焉善和予者惟李季和季和死和者寡矣且命吳復録季和死後凡若干首至其墓焚白之則世之知先生之詩者葢尠矣琬登鐵門學詩因輯先生前後所製者二百首連吳復所編又三百首名曰鐵崖先生復古詩集此集出而我朝之詩斯為大備嗟乎紅紫亂朱鄭衞亂雅生於季世而欲為詩於古度越齊梁追踪漢魏而上薄乎騷雅是秉正色於紅紫之中奏韶濩於鄭衞之際不其難矣哉此先生之作所以為復古而非一時流輩之所能班南北詞人推為苐一詩宗此非琬之言也天下之言也先生近體而下不令人傳然膾炙在人口有不可得而遺者録於巻後而香奩諸體亦附見云至正二十四年甲辰秋九月戊子門人龍洲生章琬謹序
