body:
  text: 復古詩集巻三元楊維楨撰白頭吟見古樂府九巻長夜白頭吟新􅁝理故琴莫將一日意誤結百年心緑珠辭見古樂府九巻井底生明月樓頭墜寳星年年金谷草春入美人青雌雄曲見古樂府九巻妾夫曉出塞妾夜馳孤忠誓作干將劍一死雙雌雄連理枝見古樂府九卷主家連理木昨夜一枝零野藤沿别樹相托萬年青商婦詞蕩子發航船千里復萬里願持金剪刀去剪西江水蕩子作蕩蕩西江作西流合歡辭古樂府九巻題作生合歡朝作生合歡莫作生離泣安得並蔕堅堅似七姑汁七姑汁蜂以綴窠者玉鏡臺郎贈玉鏡臺妾挂菱花盤安得咸陽鏡照郎心肺肝䌫舟石江邊䌫舟石䌫觧不留痕長恨浮萍草難仝結縷根楊柳詞楊桞董家橋鵞黄㡬萬條行人莫到此春色易相撩㡬萬一作萬萬又長條一丈長長似紫􅁝韁長條挽易斷五馬過横塘採蓮曲見古樂府九巻東湖採蓮葉南湖採蓮花一花與一葉持寄阿侯家南湖一作西湖又同生願同死死葬清泠洼下作鎻子藕上作雙頭花賭春曲見古樂府九巻鬭草歸來後開筵又賭春階前􅐰珠戲獨是得雙人擬雪詞小姑善擬雪擬雪廣寒髙剪落雙娥髪紛飛玉兎毛聞鴈篇見古樂府九巻樓頭聞過鴈隻影不成雙一夜狂夫夢相隨到九江繫馬辭見古樂府九巻誰繫西枝馬馬嘶花亂飛花飛猶自可莫遣折花枝春波曲見古樂府九巻家住春波上春深未得歸桃花新水長應汲浣紗磯浣紗一作浣花彈瑟篇静夜彈湘瑟扁舟在鶴灘九峰江上見渾似九疑山續絃言見古樂府九巻麟角煑為膠續絃絃在弓丁寧絃上箭莫射孤飛鴻丁寧作誓將莫作不買妾言見古樂府九巻買妾千黄金許身不許心使君聞有婦夜夜白頭吟去妾詞萬里戎􅏻出琵琶上錦韀傳來馬上曲猶唱想夫憐想夫憐曲名也玉蹄騧見古樂府九巻銀腦玉蹄騧金鞭問妾家忩開桃葉渡小艇在荷花空桑曲見古樂府九巻題作髙樓曲髙樓有獨婦白晝彈空桑門前誰下馬不是五樓倡女蔓草誓作女蔓草不作天羅瓜女蔓纒樹死天羅挂西家挂一作過復古詩集卷三
