  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0587_WYG_004-1a, image: WYG1222/WYG1222-0133a.png}
body:
  text: 復古詩集巻四元楊維楨撰宫詞宫詞詩家之大香奩也不許村學究語為本朝宫詞者多矣或拘於用典故又或拘於用國語皆損詩體天厯間余同年薩天錫善為宫詞且索余和什通和二十章今存十二章雞人報曉五門開鹵簿千官泊帝臺天上鴐鵞先有信九重鸞駕上都㢠毎歲此禽先駕往返又開國遺音樂府傳白翎飛上十三絃大金優諌關卿在伊尹扶湯進劇編又海内車書混一時奎章御筆冩烏絲朝來中貴傳宣急南國宫娥拱鳯池又薫風殿閣日初長南貢新來荔子香西邸阿環方病齒金籠分賜雪衣娘又宫錦裁衣錫聖恩朝來金榜揭天門老娥元是南州女私喜南人擢殿元又北幸和林幄殿寛鈎麗女侍婕妤官君王自賦昭君曲勑賜琵琶馬上彈又后土璚仙屬内家揚州從此絶名花君王題品容誰並萼緑宫中萼緑華又十二璚樓浸月華桐花移影上忩紗簷前不挿鹽枝竹卧聽金羊引小車又金屋秋深露氣凉宫監乆不到西廂丁寧莫竊寧哥笛鸚姆無情説短長又露氣夜生鳷鵲樓井梧葉葉已知秋君王只禁宫中蠱不禁流紅出御溝又十三宫女善詞章長立君王玉几傍阿婉有才還有累宫中鸚鵡啄條桑又蛾眉矉處不勝秋長帶芙蓉小苑愁肯為君王通一笑羽書烽火誤諸侯春俠雜詞見古樂府十巻金丸脱手弹鸚鵡玉鞭嬉笑撃珊瑚侍兒無頼有如此知是霍家馮子都又見古樂府十巻花袍白面呼郎神當街奪花不避人天馬乘龍金絡腦賈家貴壻正嬌春又見古樂府十巻柘林縱獵金毛鷹花街行春銀面馬夜宿娼樓酒未醒飄風吹落鴛鴦瓦又昨日布衣行九州今日繡衣拜冕旒馬前清道一千歩當街不敢闚髙樓又見古樂府十巻朱提注酒酒如池太白淋漓喫不辭上樓更衣玉山倒腰間帶脱金犀毗又關右新來豪俠客姓字不通人不識夜半酒醒呼阿吉平觧頥為我吹筆笛又見古樂府十巻蜀琴聲奏雙鴛鴦嶰竹和鳴雙鳯凰夜䦨酒醒不上馬紫荆月墮西家墻又見古樂府十巻西江美人乆不見手把新題合歡扇鯉魚憑送相思書㶚王門前水如箭小㳺仙見古樂府十巻青旄節衛翠雲軿按部東行過赤城龍女遺珠雞卵大結為雙珮賜方平又若木西來赤岸東白金城闕碧珠宫天家令急不敢住折得五花歸飯龍又東逾弱水赤流深夜得桃都息羽旌地底日迴天上出金雞如鳯自交鳴出一作去又金蛾蕋生瑶水隂錦駝鳥鳴珠樹林上皇勅賜龍色酒天樂五雲流玉音蛾一作鵞又麻姑今夜過青丘玉醴催斟白玉舟莫向外人矜指爪酒酣為我擘箜􅔃又女郎兩兩白玉牀對博宛在橘中央青城不賭熊盈襪間賭蕭家雙鳯凰兩兩一作雙雙又蓮葉舟髙河漢埀黄姑玉女㑹佳期玉清乆入衙城洞莫遣成都賣卜知葉一作花又道人得道輕骨毛飛渡海水能千邅明朝挾至兩浮島卧看滄江戲六鼇海一作弱又青丘書隨雷電亡尚作草木蟲魚荒問渠甲子不能記但指綠睛雙眼方又天上茛常宫又成文章只數老𤣥卿五雲閣吏亦謫世牛鬼少年專盛名又日落海門吹鳯匏須臾海水沸如炮船頭處女來聽曲知是洞庭千歲蛟聽曲一作相喚又當時笑我去學仙汝但求金與求田不知昨夜城頭鶴問汝無人識墓阡詠女史李夫人李延年歌北方有佳人事金屋君王獨有情少翁魂魄夜張燈可堪一死禍猶烈身釁胡塵到李陵鉤弋夫人漢武帝宫人生昭帝者婕儀未換毌儀尊聞道君王已寡恩太子宫中無木偶可無鞠域到堯門伏生女伏生年九十餘以女口授尚書老子當時無女雛秦灰安得見全書中郎有女能傳業傳得鳴笳業不如班婕妤前漢成帝宫長門不用買多才紈扇炎涼善自裁五鬼一言能寤主秋風愁殺望思臺趙昭儀前漢成帝宫通仙門裏春晝長侍兒新擁試蘭湯君王空㪚黄金餅不見宫中赤鳯凰王氏后前漢元帝后沙禁鍾靈六百年存劉一璽忍輕捐老天有意毌天下黄霧如何塞九天賈南風西晉惠帝后識暗鳴蛙苦不夫簏箱下取洛城奴宫中得子如銅馬豈特琅琊犢換駼緑珠石崇以珠三斛買梁氏女百斛明珠價莫加髙樓投璧璧無瑕臨春不死燕脂井又逐降旛上檻車馮小憐北齊穆后愛衰侍婢馮小奴大幸前山校獵御同車一笑平陽等戰蝸換得后衣纔上馬琵琶又屬代王家獨孤后隋文帝后别宅猶容駕短轅獨孤苦以妬虧賢他時崔婦生家禍晉邸安壤寵自專武后唐髙宗后忠良斬刈若芻蕘乳虎蒼鷹積滿朝可是唐臣無杜伯危心只忌六宫猫楊太真唐𤣥宗妃萬花樷裏澤初承紫磨金揺不自勝義髻早知無死所不如生不負青陵王凝妻李氏唐王凝字叔怙王通弟也山店孤兒背面啼玉腕一觧軟如泥當時義勇能相敵木葉山中亦有妻盼盼唐張建封節制武寧納妓盼盼於燕子樓公薨不他適塚上白楊今十年樓頭燕子尚留連銅臺多少丁寧恨誰向西陵望墓田韓蘄王夫人宋韓世忠妻巫家卜偶不為嫌優女占夫事更堅看取異時真畏友九重書上議黄天宋度宗女嬪一曲髙歌玉樹秋小嬪端解替人愁葉妃只解傷春泣之死何如恤緯憂青峰廟王氏一作青風天台王氏宋末兵擄至剡之青峰澗嚙血題詩投水死比胡笳則優律之巴陵則劣矣余因過此見陳長卿詩而美之遂題詩於石壁上長卿詩云寧死標名不願存潔身如水凛貞魂青峰嶺上題詩句猶沁當時指血痕介馬䭾䭾百里程青峰後夜血書成只應劉阮桃花水不似巴陵漢水清女貞木楊氏余從父女弟名宜既笄許陸氏子娶一夕陸卒後逹官聘之宜誓不嫁母偪之閉重户自盡余表墓曰女貞守死重關志不暌九泉不負陸郎妻至今墳上女貞木不受商陵怨鳥棲復古詩集巻四
