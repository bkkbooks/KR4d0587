body:
  text: 復古詩集卷三元楊維楨撰白頭吟見古樂府九卷長夜白頭吟新絲理故琴莫將一日意誤結百年心緑珠辭見古樂府九卷井底生明月樓頭墜寶星年年金谷草春入美人青雌雄曲見古樂府九卷妾夫曉出塞妾夜馳孤忠誓作干將劍一死雙雌雄連理枝見古樂府九卷主家連理木昨夜一枝零野藤沿别樹相托萬年青商婦詞蕩子發航船千里復萬里願持金剪刀去剪西江水蕩子作蕩蕩西江作西流合歡辭古樂府九卷題作生合歡朝作生合歡莫作生離泣安得並蒂堅堅似七姑汁七姑汁蜂以綴窠者玉鏡臺郎贈玉鏡臺妾挂菱花盤安得咸陽鏡照郎心肺肝纜舟石江邊纜舟石纜解不留痕長恨浮萍草難同結縷根楊柳詞楊桞董家橋鵝黃幾萬條行人莫到此春色易相撩幾萬一作萬萬又長條一丈長長似紫絲韁長條挽易斷五馬過橫塘採蓮曲見古樂府九卷東湖採蓮葉南湖採蓮花一花與一葉持寄阿侯家南湖一作西湖又同生願同死死葬清泠窪下作鎖子藕上作雙頭花賭春曲見古樂府九卷鬭草歸來後開筵又賭春階前撤珠戲獨是得雙人擬雪詞小姑善擬雪擬雪廣寒髙剪落雙娥髮紛飛玉兔毛聞鴈篇見古樂府九卷樓頭聞過鴈隻影不成雙一夜狂夫夢相隨到九江繫馬辭見古樂府九卷誰繫西枝馬馬嘶花亂飛花飛猶自可莫遣折花枝春波曲見古樂府九卷家住春波上春深未得歸桃花新水長應汲浣紗磯浣紗一作浣花彈瑟篇靜夜彈湘瑟扁舟在鶴灘九峰江上見渾似九疑山續絃言見古樂府九卷麟角煮為膠續絃絃在弓丁寧絃上箭莫射孤飛鴻丁寧作誓將莫作不買妾言見古樂府九卷買妾千黃金許身不許心使君聞有婦夜夜白頭吟去妾詞萬里戎􅏻出琵琶上錦韀傳來馬上曲猶唱想夫憐想夫憐曲名也玉蹄騧見古樂府九卷銀腦玉蹄騧金鞭問妾家忩開桃葉渡小艇在荷花空桑曲見古樂府九卷題作髙樓曲髙樓有獨婦白晝彈空桑門前誰下馬不是五樓倡女蔓草誓作女蔓草不作天羅瓜女蔓纒樹死天羅挂西家挂一作過復古詩集卷三
