body:
  text: 復古詩集卷五元楊維楨撰香奩集并序雲間詩社香奩八題無春坊才情者多為題所困縱有篇什正如三家村婦學宫妝院體終帶鄙狀可醜也晚得玉樓子八作衆推為甲而長短句樂府絶無可拈出者雲菴老先生寄示踏莎行八闋讀之驚喜先生蓋松雪翁門倩今年八十有三矣而堅強清爽出語娟麗流便此殆雪月中神仙人也謹以付翠兒度腔歌之又評付龍洲生附八詠詩後繡梓以見王孫門中舊時月色雖閲喪亂固無恙也至正丙午春三月初吉錦窶老人楊楨敘錦窶一作錦窠金盆沐髮華清春晝賜溫泉綰脫青絲撒一編翠雨亂跳花底月黑雲半掩鏡中天銅仙盤滿添香露玉女盆傾拾翠鈿攏得雲鬟髙一尺罟冠新上玉臺前踏莎行以下八闋倛雲菴叟王德璉作寶鑑凝膏溫泉流膩璚纎一把青絲墜氷膚淺漬麝煤春花香石髓和雲洗玉女峰前咸池月底臨風輕把犀梳理陽臺行雨乍歸來羅巾猶帶瀟湘水月奩勻面一片清光照膽寒玉容滿鏡掩飛鸞素娥照見黃金闕絳雪鎔開白玉盤翠點桞尖春未透紅生櫻顆落初乾好風與我披羅幕一朵芙容正面看踏莎行氷鑑懸秋瓊腮凝素鉛華夜搗長生兔玉容自擬比姮娥粧成尖恐姮娥妬花影涵空蟾光籠霧芙容一朵漙秋露年年只在廣寒宫今宵鸞影驚相遇玉頰啼痕天然玉質洗鉛華怪底偏將半面遮紅滴香氷融獺髓彩粘膩雨上梨花收乾通德言難盡點濕明妃畫莫加聚得斑斑在何處軟綃寄與薄情家踏莎行粉凝紅氷香銷獺髓鏡鸞影裏人憔悴梨花帶雨不禁愁玉纎彈盡相思淚恨鎖春山嬌橫秋水臉桃零落胭脂碎故將羅帊揾啼痕寄情欲比相思字黛眉顰色按樂圖開列滿堂春愁何獨損清揚蜀山煙雨雙尖瘦漢桞風霜兩葉蒼索畫未成京兆譜欲啼先學壽陽妝蕭郎忽有歸期報喜見天庭一點黃踏莎行淡掃春痕輕籠芳靨捧心不效吳宫怨楚梅酸蹙翠尖纖湘煙碧聚愁萋蒨紺羽寒凝月鈎金灔鶯吭咽處微偷斂新翻嫵態太嬌嬈鏡中蛾緑和香點芳塵春迹是誰步屧印微茫便似名家春滿牀軟雪消時痕晃底好風生處步生香綵雲飛上鞦韆蹬芳草侵來蹴踘場愁絶似癡成獨立綵鴛拾得在東牆踏莎行金谷逰情消磨不盡軟紅香裏雙鴛印蘭膏步滑翠生痕金蓮脫落淩波影蝶徑遺蹤鴈沙凝潤為誰留下東風恨玉兒飛化夢中雲青蘋流水空仙詠雲忩秋夢骨冷魂清酒力微路迷錯草是還非羅浮曉月相將落巫峽斷雲何處飛金彈撇過驚忽忽玉龍嘶了尚依依不知直到鈞天所記得霓裳樂譜歸踏莎行煙冷瑶􅎉神逰貝闕芙容城裏花如雪仙郎同躡鳯凰翎千門萬户皆明月海碧山青天荒地老滿身風露飄環玦髙樓畫角苦無情一聲吹散雙飛蝶繡牀凝思綵線添來日正遲香絨倦理一支頥心逰飛絮渾無著身蛻枯蟬忽若癡花幀錯描愁伴覺金針閣住許誰知絶憐小玉情緣重到死春蠶始絶絲踏莎行翠藻文鴛交枝連理金針停處渾如醉楊花一點是春心鵑聲啼到人千里喚醒離魂猶疑夢裏此情恰似東流水雲忩霧閣沒人知綃痕浥透紅鉛淚金錢卜歡紫姑壇上囑方兄忽聽呼盧擲地聲星斗未分牛女會隂陽先判雨雲生青蚨孕子寧無兆玉蝶化身元有情寶鏡重圓三五夜重磨半月問虧盈踏莎行暗擲龍文尋盟鸞鏡龜兒不似青蚨凖花房羞化彩蛾飛銀橋密遞仙娥信錦屋瓊樓薄情飄性碧雲望斷紅輪暝珠簾立盡海棠隂待溫遙夜鴛衾冷復古詩集卷五
