body:
  text: 復古詩集巻六元楊維楨撰續奩集陶元亮賦閒情出􅉏御之辭不害其為處士節也余賦韓偓續奩亦作娟麗語又何損吾鐵石心腸也哉法雲道人勸魯直勿作艷歌小辭魯直曰空中語耳不致坐此墮落惡道余於續奩亦曰空中語耳不料為萬口播傳兵火後龍洲生尚能口記又付之市肆梓而行之因書此以識吾過時道林法師在座余合手曰若墮惡道請師懴悔桃花夢叟楊楨氏自序學琴阿琰胡笳不足傳離鸞别鵠意凄然請郎為洗筝琶耳不惜為郎彈絶絃學書歌徹陽春酒半醺玉尖搦筦蘸香雲新詞未上鴛鴦扇醉墨先汙蛺蝶裙演歌鸎鸎舌巧言猶獠字字使君親口教今日金錢初受賞倚聲同合鳯凰巢笙名習舞十六天魔教已成背反蓮掌苦嫌生夜深不管俳場歇尚向燈前蹋影行上頭新年攏鬢及笄期雲綰盤龍一把絲揜鏡問人人盡道南梳北裹總相宜染甲夜搗守宫金鳯蕋十尖盡換紅鴉觜閒來一曲鼓瑶琴數㸃桃花汎流水照畫畫得崔徽巻裏人菱花秋水脱真真只今顔色渾非舊燒藥幧頭過一春理繡㨂得金針出象筒鴛鴦雙㓨扇羅中却嗔昨夜貍奴惡抓亂金牀五色絨出浴初訝洗花難抑按終疑沃雪不勝任豈知侍女簾帷外剩取君王數餅金甘睡漏减良宵晝日遲困人天氣酒中時東家女伴太嬌劣偷觧裙腰竟不知相見酥凝背甲玉搓肩只訝紅綃覆白蓮底是太隂藏火性狂夫夜夜為君然相思深情長是暗相隨月白風清苦苦思不似東姑癡醉酒幙天席地了無知的信平時詭語難為信醉後㣲言却近真昨夜寄將雙豆蔻始知的的為東鄰私㑹月落花隂夜漏長相逢疑是夢髙唐夜深偷把銀釭照猶恐憨奴瞰隙光成配眉山暗淡向殘燈一半雲鬟撤枕稜四體著人嬌欲泣自家揉碎砑繚綾洗兒曽向金盆弄化生寳珠親見掌中擎從今不帶宜男草豆蔻含胎恐太并秋千齊雲樓外紅絡索是誰飛下雲中仙剛風吹起望不極一對金蓮倒插天蹋踘月牙束靿紅幧首月門脫落葵花斗君看脚底軟金蓮細蹴花心壽郎酒釣魚敲針作鈎投水隅豈圖口味膾王餘鯉魚腹裏牽芳餌萬一行人有素書走馬徤兒牽來獰叱撥輕身飛上電一抹半兜玉鐙裹湘裙不許春泥汙羅襪復古詩集巻六
